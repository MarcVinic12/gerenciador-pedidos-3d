<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Manager 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-btn.active { background-color: #f3f4f6; color: #2563eb; font-weight: bold; border-bottom: 2px solid #2563eb; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    
    <!-- Cabeçalho -->
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold"><i class="fas fa-cube mr-2"></i> Print Manager 3D</h1>
            <div id="status-badge" class="px-3 py-1 rounded-full text-sm font-bold bg-yellow-500 text-white">
                A Ligar...
            </div>
        </div>
    </header>

    <!-- Dashboard (Sempre Visível) -->
    <div class="max-w-6xl mx-auto p-4 mt-4 grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="bg-white p-4 rounded-lg shadow border border-gray-100">
            <p class="text-sm text-gray-500"><i class="fas fa-shopping-bag mr-1"></i> Gasto com Compras</p>
            <p class="text-2xl font-bold text-gray-800" id="dash-compras">R$ 0,00</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow border border-gray-100">
            <p class="text-sm text-gray-500"><i class="fas fa-tint mr-1"></i> Custo de Fabricação</p>
            <p class="text-2xl font-bold text-gray-800" id="dash-fabricacao">R$ 0,00</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow border border-gray-100">
            <p class="text-sm text-gray-500"><i class="fas fa-wrench mr-1"></i> Total Mão de Obra</p>
            <p class="text-2xl font-bold text-gray-800" id="dash-maodeobra">R$ 0,00</p>
        </div>
        <div class="bg-blue-50 p-4 rounded-lg shadow border border-blue-100">
            <p class="text-sm text-blue-600 font-semibold">FATURAMENTO (PEDIDOS)</p>
            <p class="text-3xl font-bold text-blue-700" id="dash-faturamento">R$ 0,00</p>
        </div>
    </div>

    <!-- Navegação das Abas -->
    <div class="max-w-6xl mx-auto mt-4 px-4">
        <div class="flex space-x-2 border-b border-gray-200">
            <button onclick="switchTab('tab-novo-pedido')" class="tab-btn active px-4 py-2 text-gray-600 rounded-t-lg transition-colors">
                <i class="fas fa-plus-circle mr-1"></i> Novo Pedido
            </button>
            <button onclick="switchTab('tab-lista-pedidos')" class="tab-btn px-4 py-2 text-gray-600 rounded-t-lg transition-colors">
                <i class="fas fa-list mr-1"></i> Meus Pedidos
            </button>
            <button onclick="switchTab('tab-materiais')" class="tab-btn px-4 py-2 text-gray-600 rounded-t-lg transition-colors">
                <i class="fas fa-shopping-cart mr-1"></i> Materiais Comprados
            </button>
        </div>
    </div>

    <!-- Conteúdo das Abas -->
    <div class="max-w-6xl mx-auto p-4 mb-10">
        
        <!-- ABA: Novo Pedido -->
        <div id="tab-novo-pedido" class="tab-content active bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            <h2 class="text-xl font-bold mb-4 text-gray-700">Registar Novo Pedido</h2>
            <form id="form-pedido" class="space-y-4 max-w-4xl">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nome do Cliente</label>
                        <input type="text" id="cliente" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                    </div>
                    <div>
                        <label class="block text-sm font-medium
